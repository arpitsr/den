# Egress policy for the pit sandbox proxy (PIT_PROXY_POLICY=examples/egress-policy.yaml).
# Entries match the host exactly or any subdomain. deny wins over allow.
# Merged over the built-in defaults (src/default-egress.yaml);
# re-read on every connection, so edits apply without restarting the sandbox.

allow:
  - example.com          # allow example.com and *.example.com

deny:
  - dl.github.com        # carve a subdomain back out of the default github.com allow
