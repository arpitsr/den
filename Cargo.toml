[package]
name = "pit"
version = "0.1.0"
edition = "2021"
description = "Run any local coding-agent CLI inside an AgentFS sandbox, with typed SDK access to the resulting state."

[[bin]]
name = "pit"
path = "src/main.rs"

[dependencies]
agentfs-sdk = "0.6.4"
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }
anyhow = "1"
libc = "0.2"
litetx = "0.1.0"
rusqlite = { version = "0.29", features = ["bundled"] }
# pure-Rust FUSE (no libfuse C dep); abi-7-31 enables the caps we request
# in init (writeback cache, parallel dirops, no-opendir, etc.) and
# fuse_forget_one / Session::notifier
fuser = { version = "0.15", default-features = false, features = ["abi-7-31"] }
async-trait = "0.1.92"
serde = { version = "1", features = ["derive"] }
serde_yaml = "0.9"
