[package]
name = "den"
version = "0.1.0"
edition = "2021"
description = "Run any local coding-agent CLI inside an AgentFS sandbox, with typed SDK access to the resulting state."

[[bin]]
name = "den"
path = "src/main.rs"

[dependencies]
agentfs-sdk = "0.6.4"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "time", "sync", "process", "signal"] }
# platform API server (docs/platform-api.md): axum over the existing tokio
# runtime; json + http1 + tokio only — no form/multipart/query extras
axum = { version = "0.8", default-features = false, features = ["http1", "json", "tokio", "query"] }
# unix-socket transport for serve (docs/socket-daemon.md): accept the local
# connection ourselves and inject SO_PEERCRED creds as request extensions
hyper = { version = "1", default-features = false, features = ["http1", "server"] }
hyper-util = { version = "0.1", default-features = false, features = ["tokio"] }
# tower::Service needed to invoke the axum Router from the socket accept loop
tower = { version = "0.5", default-features = false }
anyhow = "1"
libc = "0.2"
litetx = "0.1.0"
rusqlite = { version = "0.29", features = ["bundled"] }
# pure-Rust FUSE (no libfuse C dep); abi-7-31 enables the caps we request
# in init (writeback cache, parallel dirops, no-opendir, etc.) and
# fuse_forget_one / Session::notifier
fuser = { version = "0.15", default-features = false, features = ["abi-7-31"] }
async-trait = "0.1.92"
serde = { version = "1", features = ["derive"] }
# platform API-key hashing (docs/platform-api.md §17): only sha256(key) is stored
sha2 = "0.10"
serde_json = "1"
serde_yaml = "0.9"
